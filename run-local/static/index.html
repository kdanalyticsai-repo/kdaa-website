<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KDA Analytics — Where Data Meets Intelligence</title>
    <meta
      name="description"
      content="KDA Analytics — global intelligence platform for the AI startup ecosystem."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <script src="/static/js/react.min.js"></script>
    <script src="/static/js/react-dom.min.js"></script>
    <script src="/static/js/remix-router.min.js"></script>
    <script src="/static/js/react-router.min.js"></script>
    <script src="/static/js/react-router-dom.min.js"></script>
    <script src="/static/js/babel.min.js"></script>
    <script>
      window.onerror = function (msg, src, line, col, err) {
        var d = document.getElementById("root");
        if (d)
          d.innerHTML =
            '<div style="color:#ff6b6b;font-family:monospace;padding:2rem;font-size:14px;white-space:pre-wrap"><b>JS Error:</b>\n' +
            msg +
            "\nLine: " +
            line +
            "\nSource: " +
            src +
            "</div>";
      };
    </script>
    <style>
      /* ─── CSS Variables & Reset ─────────────────────────────────────────────── */
      :root {
        --bg: #040810;
        --surface: #080f1e;
        --card: #0c1628;
        --border: #1a2d50;
        --accent: #00d4ff;
        --accent2: #7c3aed;
        --accent3: #10b981;
        --text: #e8f0fe;
        --muted: #6b7fa8;
        --fd: "Syne", sans-serif;
        --fb: "DM Sans", sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--fb);
        font-weight: 300;
        overflow-x: hidden;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: var(--fd);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      /* ─── Animations ─────────────────────────────────────────────────────────── */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      @keyframes marquee {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes barGrow {
        from {
          transform: scaleY(0);
          opacity: 0;
        }
        to {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      /* ─── Reveal ─────────────────────────────────────────────────────────────── */
      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 0.7s ease,
          transform 0.7s ease;
      }
      .reveal.visible {
        opacity: 1;
        transform: none;
      }

      /* ─── Utility ─────────────────────────────────────────────────────────────── */
      .grad {
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .section-label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--accent);
        margin-bottom: 0.8rem;
        font-weight: 500;
      }
      .section-title {
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        font-weight: 800;
        line-height: 1.2;
        margin-bottom: 0.9rem;
      }
      .section-sub {
        color: var(--muted);
        max-width: 540px;
        font-size: 0.97rem;
        line-height: 1.8;
      }
      section {
        padding: 6rem 5%;
      }
      .page-enter {
        animation: fadeUp 0.5s ease both;
      }

      /* ─── Buttons ─────────────────────────────────────────────────────────────── */
      .btn-p {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.85rem 2rem;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), #0099cc);
        color: #040810;
        font-family: var(--fd);
        font-weight: 700;
        font-size: 0.93rem;
        cursor: pointer;
        transition: all 0.25s;
        box-shadow: 0 0 28px rgba(0, 212, 255, 0.22);
        border: none;
      }
      .btn-p:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 48px rgba(0, 212, 255, 0.4);
      }
      .btn-o {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.85rem 2rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-family: var(--fd);
        font-weight: 600;
        font-size: 0.93rem;
        cursor: pointer;
        transition: all 0.25s;
      }
      .btn-o:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(0, 212, 255, 0.05);
      }

      /* ─── Nav ─────────────────────────────────────────────────────────────────── */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.1rem 5%;
        transition:
          background 0.3s,
          border-color 0.3s;
        border-bottom: 1px solid transparent;
      }
      nav.scrolled {
        background: rgba(4, 8, 16, 0.92);
        backdrop-filter: blur(20px);
        border-color: var(--border);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 0.15rem;
        font-family: var(--fd);
        font-weight: 800;
        font-size: 1.1rem;
        letter-spacing: -0.02em;
      }
      .logo .lb {
        color: var(--accent);
        opacity: 0.6;
      }
      .logo .sub {
        color: var(--muted);
        font-weight: 400;
        font-size: 0.85rem;
        margin-left: 0.4rem;
      }
      .nav-links {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 2.2rem;
      }
      .nav-links a {
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 400;
        text-decoration: none;
        transition: color 0.2s;
        position: relative;
        padding-bottom: 2px;
      }
      .nav-links a::after {
        content: "";
        position: absolute;
        bottom: -3px;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--accent);
        transform: scaleX(0);
        transition: transform 0.2s;
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: var(--text);
      }
      .nav-links a:hover::after,
      .nav-links a.active::after {
        transform: scaleX(1);
      }
      .nav-cta {
        padding: 0.5rem 1.3rem;
        border-radius: 6px;
        background: var(--accent);
        color: #040810;
        font-family: var(--fd);
        font-weight: 700;
        font-size: 0.83rem;
        text-decoration: none;
        transition: all 0.2s;
        box-shadow: 0 0 18px rgba(0, 212, 255, 0.25);
      }
      .nav-cta:hover {
        background: #fff;
        transform: translateY(-1px);
      }
      .ham {
        display: none;
        flex-direction: column;
        gap: 5px;
        padding: 4px;
        cursor: pointer;
      }
      .ham span {
        display: block;
        width: 22px;
        height: 2px;
        background: var(--text);
        border-radius: 2px;
        transition: all 0.25s;
      }

      /* ─── Hero ─────────────────────────────────────────────────────────────────── */
      #hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding: 8rem 5% 5rem;
        position: relative;
        overflow: hidden;
      }
      .hero-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(
          ellipse 80% 60% at 50% 50%,
          black,
          transparent
        );
      }
      .hero-glow {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        width: 700px;
        height: 400px;
        background: radial-gradient(
          ellipse,
          rgba(0, 212, 255, 0.08) 0%,
          rgba(124, 58, 237, 0.06) 50%,
          transparent 70%
        );
        pointer-events: none;
      }
      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 1rem;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: rgba(0, 212, 255, 0.06);
        font-size: 0.78rem;
        color: var(--accent);
        margin-bottom: 2rem;
        animation: fadeUp 0.8s ease both;
        position: relative;
        z-index: 1;
      }
      .hero-title {
        font-size: clamp(2.8rem, 6vw, 5.5rem);
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 1.4rem;
        animation: fadeUp 0.9s 0.1s ease both;
        position: relative;
        z-index: 1;
      }
      .hero-sub {
        max-width: 600px;
        font-size: 1.05rem;
        color: var(--muted);
        margin-bottom: 2.5rem;
        line-height: 1.8;
        animation: fadeUp 1s 0.2s ease both;
        position: relative;
        z-index: 1;
      }
      .hero-actions {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
        animation: fadeUp 1s 0.3s ease both;
        position: relative;
        z-index: 1;
      }
      .hero-stats {
        display: flex;
        gap: 3rem;
        margin-top: 4.5rem;
        flex-wrap: wrap;
        justify-content: center;
        animation: fadeUp 1s 0.4s ease both;
        position: relative;
        z-index: 1;
      }
      .stat-num {
        font-family: var(--fd);
        font-size: 2rem;
        font-weight: 800;
        color: var(--accent);
      }
      .stat-lbl {
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      /* ─── Marquee ─────────────────────────────────────────────────────────────── */
      .marquee-wrap {
        background: var(--surface);
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 1.1rem 0;
        overflow: hidden;
      }
      .marquee-track {
        display: flex;
        gap: 3rem;
        animation: marquee 30s linear infinite;
        width: max-content;
      }
      .marquee-item {
        font-family: var(--fd);
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--muted);
        white-space: nowrap;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      /* ─── Feature cards ────────────────────────────────────────────────────────── */
      .feat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 1px;
        border: 1px solid var(--border);
        margin-top: 3.5rem;
      }
      .feat-card {
        background: var(--card);
        padding: 2.2rem;
        border: 1px solid var(--border);
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        display: block;
        color: inherit;
        text-decoration: none;
      }
      .feat-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(0, 212, 255, 0.06),
          transparent
        );
        opacity: 0;
        transition: opacity 0.3s;
      }
      .feat-card:hover {
        border-color: rgba(0, 212, 255, 0.3);
        transform: translateY(-2px);
      }
      .feat-card:hover::before {
        opacity: 1;
      }
      .feat-icon {
        width: 46px;
        height: 46px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.35rem;
        margin-bottom: 1.3rem;
      }
      .feat-title {
        font-family: var(--fd);
        font-size: 1.02rem;
        font-weight: 700;
        margin-bottom: 0.6rem;
      }
      .feat-desc {
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.7;
      }

      /* ─── Service cards ────────────────────────────────────────────────────────── */
      .svc-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.4rem;
        margin-top: 3.5rem;
      }
      .svc-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2.3rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        transition: all 0.3s;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        position: relative;
        overflow: hidden;
      }
      .svc-card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 14px;
        background: linear-gradient(
          135deg,
          rgba(0, 212, 255, 0.04),
          transparent 60%
        );
        opacity: 0;
        transition: opacity 0.3s;
      }
      .svc-card:hover {
        border-color: rgba(0, 212, 255, 0.35);
        transform: translateY(-3px);
        box-shadow: 0 20px 56px rgba(0, 0, 0, 0.42);
      }
      .svc-card:hover::after {
        opacity: 1;
      }
      .svc-card.featured {
        background: linear-gradient(
          135deg,
          rgba(0, 212, 255, 0.06),
          rgba(124, 58, 237, 0.06)
        );
        border-color: rgba(0, 212, 255, 0.15);
        grid-column: 1/-1;
      }
      .svc-num {
        font-family: var(--fd);
        font-size: 2.6rem;
        font-weight: 800;
        color: var(--border);
        line-height: 1;
      }
      .svc-title {
        font-family: var(--fd);
        font-size: 1.28rem;
        font-weight: 700;
      }
      .svc-desc {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.75;
        flex: 1;
      }
      .svc-arrow {
        color: var(--accent);
        font-size: 0.85rem;
        margin-top: 0.3rem;
      }

      /* ─── Process ─────────────────────────────────────────────────────────────── */
      .proc-steps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        position: relative;
      }
      .proc-steps::before {
        content: "";
        position: absolute;
        top: 27px;
        left: 8%;
        right: 8%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--border),
          var(--border),
          transparent
        );
      }
      .step {
        text-align: center;
        padding: 1.8rem 1.2rem;
      }
      .step-num {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--card);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--fd);
        font-weight: 800;
        color: var(--accent);
        margin: 0 auto 1.3rem;
        font-size: 1rem;
        position: relative;
        z-index: 1;
      }
      .step h4 {
        font-size: 0.97rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      .step p {
        font-size: 0.85rem;
        color: var(--muted);
      }

      /* ─── Business tiles ──────────────────────────────────────────────────────── */
      .biz-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.4rem;
        margin-top: 3.5rem;
      }
      .biz-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2.3rem;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        transition: all 0.3s;
      }
      .biz-card:hover {
        border-color: rgba(0, 212, 255, 0.3);
        transform: translateY(-3px);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.4);
      }
      .biz-card.highlight {
        background: linear-gradient(
          135deg,
          rgba(0, 212, 255, 0.07),
          rgba(124, 58, 237, 0.07)
        );
        border-color: rgba(0, 212, 255, 0.2);
      }
      .biz-card h3 {
        font-family: var(--fd);
        font-size: 1.2rem;
        font-weight: 700;
      }
      .biz-card p {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.7;
        flex: 1;
      }
      .biz-arrow {
        color: var(--accent);
        font-size: 0.85rem;
      }

      /* ─── Contact Form ────────────────────────────────────────────────────────── */
      .contact-layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 2.5rem;
        max-width: 1100px;
        margin: 0 auto;
      }
      .info-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2rem;
        margin-bottom: 1.3rem;
      }
      .info-card h3 {
        font-family: var(--fd);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 1.3rem;
      }
      .info-row {
        display: flex;
        align-items: flex-start;
        gap: 0.9rem;
        padding: 0.8rem 0;
        border-bottom: 1px solid var(--border);
      }
      .info-row:last-child {
        border-bottom: none;
      }
      .info-icon {
        font-size: 1.1rem;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .info-lbl {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .info-val {
        font-size: 0.92rem;
        color: var(--text);
      }
      .info-val a {
        color: var(--accent);
      }
      .form-wrap {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.5rem;
      }
      .form-title {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 1.8rem;
        padding-bottom: 1.3rem;
        border-bottom: 1px solid var(--border);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        margin-bottom: 1.1rem;
      }
      .field label {
        font-size: 0.76rem;
        font-weight: 500;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }
      .field input,
      .field select,
      .field textarea {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.8rem 1rem;
        color: var(--text);
        font-family: var(--fb);
        font-size: 0.93rem;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        outline: none;
        resize: vertical;
        width: 100%;
      }
      .field input::placeholder,
      .field textarea::placeholder {
        color: var(--muted);
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      }
      .field select option {
        background: var(--surface);
      }
      .form-error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.25);
        border-radius: 8px;
        padding: 0.85rem 1rem;
        color: #fca5a5;
        font-size: 0.88rem;
        margin-bottom: 1rem;
      }
      .form-submit {
        width: 100%;
        justify-content: center;
        padding: 1rem;
        font-size: 0.97rem;
        margin-top: 0.3rem;
      }
      .form-privacy {
        font-size: 0.74rem;
        color: var(--muted);
        text-align: center;
        margin-top: 0.8rem;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(4, 8, 16, 0.3);
        border-top-color: #040810;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        display: inline-block;
        margin-right: 0.4rem;
      }
      .success-box {
        text-align: center;
        padding: 3rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .success-icon {
        font-size: 3.5rem;
      }
      .success-box h2 {
        font-size: 1.7rem;
        font-weight: 800;
      }
      .success-box p {
        color: var(--muted);
        font-size: 0.97rem;
        line-height: 1.7;

          obs.observe(el); return()=>obs.disconnect();
        },[t]);
        return ref;

      // ── Contact Page ───────────────────────────────────────────────────────────────
      function ContactPage(){
        const[status,setStatus]=useState('idle'); // idle|loading|success|error
        const[errMsg,setErrMsg]=useState('');
        const[leadId,setLeadId]=useState('');
        const[form,setForm]=useState({first_name:'',last_name:'',email:'',company:'',phone:'',interest:INTERESTS[0],message:''});
        const onChange=e=>setForm(f=>({...f,[e.target.name]:e.target.value}));

        const mockSubmit=async(payload)=>{
          // Client-side validation mirrors backend
          if(!payload.first_name||payload.first_name.length<2) throw new Error('First name must be at least 2 characters.');
          if(!payload.last_name||payload.last_name.length<2)   throw new Error('Last name must be at least 2 characters.');
          if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(payload.email)) throw new Error('Please enter a valid email address.');
          if(!payload.message||payload.message.length<10)       throw new Error('Message must be at least 10 characters.');
          if(payload.message.length>2000)                       throw new Error('Message cannot exceed 2000 characters.');
          await new Promise(r=>setTimeout(r,1200)); // realistic delay
          const id='KDA-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
          // Store in localStorage so leads persist across page visits
          const leads=JSON.parse(localStorage.getItem('kda_leads')||'[]');
          leads.push({id,...payload,timestamp:new Date().toLocaleString(),status:'new'});
          localStorage.setItem('kda_leads',JSON.stringify(leads));
          return {success:true,message:"Thank you! We'll be in touch within 24 business hours.",lead_id:id};
        };

        const onSubmit=async(e)=>{
          e.preventDefault();
          setStatus('loading'); setErrMsg('');
          try{
            let data;
            try{
              // Try real Flask backend first (works when running python3 server.py)
              const res=await fetch('/api/v1/contact',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify(form),
              });
              data=await res.json();
              if(!res.ok) throw new Error(data.error||`Error ${res.status}`);
            }catch(fetchErr){
              // Fallback: run validation + mock response in-browser
              data=await mockSubmit(form);
            }
            setLeadId(data.lead_id||'');
            setStatus('success');
          }catch(err){
            setErrMsg(err.message||'Something went wrong. Please email us directly.');
            setStatus('error');
          }
        };

        const reset=()=>{setStatus('idle');setForm({first_name:'',last_name:'',email:'',company:'',phone:'',interest:INTERESTS[0],message:''})};

        return(
          <div className="page-enter">
            <div className="page-hero">
              <div className="page-glow" style={{left:'unset',right:'5%',transform:'none'}}/>
              <div className="section-label">Contact</div>
              <h1 className="detail-title">Let's build something intelligent</h1>
              <p className="section-sub">Tell us about your goals — our team responds within 24 business hours.</p>
            </div>
            <section>
              <div className="contact-layout">
                {/* Info */}
                <aside>
                  <div className="info-card">
                    <h3>Get in Touch</h3>
                    {[['✉️','Email',<a href="mailto:info@kdaanalytics.com" className="info-val">info@kdaanalytics.com</a>],
                      ['📍','Headquarters',<span className="info-val">New Delhi NCR Region</span>],
                      ['⏱️','Response Time',<span className="info-val">Within 24 business hours</span>],
                    ].map(([icon,lbl,val])=>(
                      <div key={lbl} className="info-row">
                        <span className="info-icon">{icon}</span>
                        <div><div className="info-lbl">{lbl}</div>{val}</div>
                      </div>
                    ))}
                  </div>
                  <div className="info-card">
                    <h3>Engagements</h3>
                    {[['🏢','Enterprise & Strategy','Custom intelligence & advisory'],
                      ['💼','Investors & Funds','Deal flow & due diligence'],
                      ['🚀','Startups & Founders','Get featured & funded'],
                      ['🔌','API & Data Licensing','Developer & data access'],
                    ].map(([icon,t,s])=>(
                      <div key={t} className="info-row">
                        <span className="info-icon">{icon}</span>
                        <div><div style={{fontSize:'.88rem',fontWeight:600,color:'var(--text)'}}>{t}</div><div style={{fontSize:'.76rem',color:'var(--muted)'}}>{s}</div></div>
                      </div>
                    ))}
                  </div>
                </aside>

                {/* Form */}
                <div className="form-wrap">
                  {status==='success'?(
                    <div className="success-box">
                      <div className="success-icon">🎉</div>
                      <h2>Message received!</h2>
                      <p>Thank you for reaching out. Our team will get back to you within 24 business hours.</p>
                      {leadId && <p className="lead-id">Reference: <strong>{leadId}</strong></p>}
                      <button className="btn-o" onClick={reset}>Send Another Message</button>
                    </div>
                  ):(
                    <form onSubmit={onSubmit} noValidate>
                      <h2 className="form-title">Send a Message</h2>
                      <div className="form-row">
                        <div className="field"><label>First Name *</label><input name="first_name" value={form.first_name} onChange={onChange} placeholder="First name" required minLength={2}/></div>
                        <div className="field"><label>Last Name *</label><input name="last_name" value={form.last_name} onChange={onChange} placeholder="Last name" required minLength={2}/></div>
                      </div>
                      <div className="form-row">
                        <div className="field"><label>Work Email *</label><input name="email" type="email" value={form.email} onChange={onChange} placeholder="you@company.com" required/></div>
                        <div className="field"><label>Phone</label><input name="phone" type="tel" value={form.phone} onChange={onChange} placeholder="+91 XXXXX XXXXX"/></div>
                      </div>
                      <div className="field"><label>Company</label><input name="company" value={form.company} onChange={onChange} placeholder="Company name"/></div>
                      <div className="field">
                        <label>I'm interested in *</label>
                        <select name="interest" value={form.interest} onChange={onChange}>
                          {INTERESTS.map(i=><option key={i}>{i}</option>)}
                        </select>
                      </div>
                      <div className="field"><label>Message *</label>
                        <textarea name="message" value={form.message} onChange={onChange} placeholder="Tell us about your goals, timeline, or questions…" rows={5} required minLength={10}/>
                      </div>
                      {status==='error' && <div className="form-error">⚠️ {errMsg}</div>}
                      <button type="submit" className="btn-p form-submit" disabled={status==='loading'}>
                        {status==='loading'?<><span className="spinner"/>Sending…</>:'Send Message →'}
                      </button>
                      <p className="form-privacy">We respect your privacy. Your information is never sold or shared.</p>
                    </form>
                  )}
                </div>
              </div>
            </section>
          </div>
        );
      }

                <Route path="*"                       element={<NotFound/>}/>
              </Routes>
            </main>
            <Footer/>
          </>
        );
      }

      // ── App ────────────────────────────────────────────────────────────────────────
      function App(){
        return(
          <BrowserRouter>
            <ScrollTop/>
            <Layout/>
          </BrowserRouter>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>

    <script>

        try {
          var src = document.getElementById("app-jsx").textContent;
          var result = Babel.transform(src, {
            presets: [["react", { runtime: "classic" }], "env"],

            "</div>";
          console.error("KDA App Error:", e);

    </script>
