# ── KDA Analytics — Nginx Reverse Proxy ──────────────────────────────────────
# Routes:
#   /api/*   → FastAPI backend  (port 8000)
#   /*       → React frontend   (port 80 on frontend container)

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile           on;
  keepalive_timeout  65;
  gzip               on;
  gzip_types         text/plain text/css application/json application/javascript text/xml;

  # ── Rate limiting ────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/m;
  limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/h;

  # ── Upstream services ────────────────────────────────────────────────────
  upstream backend  { server backend:8000;  }
  upstream frontend { server frontend:80;   }

  # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
  server {
    listen 80;
    server_name kdaanalytics.ai www.kdaanalytics.ai;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS main server ────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name kdaanalytics.ai www.kdaanalytics.ai;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Referrer-Policy           strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── API routes → FastAPI ─────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;

      # Tighter rate limit on contact endpoint
      location /api/v1/contact {
        limit_req zone=contact burst=3 nodelay;
        proxy_pass http://backend;
      }
    }

    # ── All other routes → React SPA ─────────────────────────────────────
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host            $host;
      proxy_set_header   X-Real-IP       $remote_addr;
      proxy_set_header   Upgrade         $http_upgrade;
      proxy_set_header   Connection      "upgrade";
    }
  }
}
